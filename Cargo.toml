[package]
name = "forge-paint"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-phosphor = "0.9"
# wgpu is reached through `egui_wgpu::wgpu` (pulls wgpu 24 to match egui-wgpu 0.31);
# no need to declare it directly.
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
bevy_mikktspace = "1"
bvh = "0.9"
nalgebra = "0.32"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
half = { version = "2", features = ["bytemuck"] }
clap = { version = "4", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

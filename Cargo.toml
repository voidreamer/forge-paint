[package]
name = "forge-paint"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.31"
egui-wgpu = "0.31"
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
bevy_mikktspace = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rfd = "0.15"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

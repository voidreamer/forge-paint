[workspace]
members = ["crates/texture-baker"]

[package]
name = "forge-paint"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
# texture-baker lives at crates/texture-baker — vendored from the
# standalone ~/projects/texture-baker, stripped of its bin/gui targets,
# and pinned to wgpu 24 to share the version egui-wgpu 0.31 uses.
texture-baker = { path = "crates/texture-baker" }

# rust-usd is the cxx-based binding to OpenUSD. Stage::open() pulls
# pxr into the process; USD's URI scheme dispatch routes `forge://...`
# to the C++ ForgeResolver loaded via PXR_PLUGINPATH_NAME (set by
# anvil). See anvil/forge-paint.yaml for the build env vars rust-usd's
# own build.rs reads.
rust-usd = "0.0.3"
# Hydra (Storm) preview renderer — wraps OpenUSD's Hd render pipeline
# behind a tiny Rust facade. Used by the Hydra preview panel; the
# wgpu painter pipeline still owns the painting / brush / composite
# path. Single-threaded; needs a real GPU; color AOV only for now.
hydra-rs = "0.0.2"

eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-phosphor = "0.9"
# wgpu is reached through `egui_wgpu::wgpu` (pulls wgpu 24 to match egui-wgpu 0.31);
# no need to declare it directly.
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
bevy_mikktspace = "1"
bvh = "0.9"
nalgebra = "0.32"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
# exr is pulled in directly so we can bypass the `image` crate's strict
# channel/memory assumptions (needed for Poly Haven single-channel and 8K
# normal-map EXRs).
exr = "1.74"
half = { version = "2", features = ["bytemuck"] }
clap = { version = "4", features = ["derive"] }
# JSON sidecar for project persistence — HP / cage paths, smart-mask
# params, bake settings, material factors. The big binary outputs (PNGs
# / EXRs) live next to it as separate files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Re-emits @rpath link args so our binaries/examples find libusd_*.dylib
# at launch without DYLD_LIBRARY_PATH. Companion to rust-usd.
rust-usd-build = "0.0.1"

[[example]]
name = "forge_uri_smoke"
path = "examples/forge_uri_smoke.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

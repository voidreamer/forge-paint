name: macos-build

# Hand-off build for sharing forge-paint with macOS Apple-Silicon
# testers. Triggered manually from the Actions tab, or automatically
# on `v*` tag push (which also attaches the resulting zip to the
# GitHub Release).
#
# First run is slow (~30-60 min) because OpenUSD has to compile from
# source. Subsequent runs reuse the cached USD install and finish in
# under 10 min — bump the cache key suffix below to invalidate.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # rust-usd 0.0.3 (forge-paint's pinned binding) is verified against
  # upstream OpenUSD 25.05. Bump together if forge-paint upgrades the
  # crate, otherwise the ABI may not match.
  USD_VERSION: v25.05
  # build_usd.py installs into this prefix; rust-usd's build.rs reads it.
  USD_INSTALL_DIR: ${{ github.workspace }}/usd-install
  USD_LIB_PREFIX: usd_
  # USD is built --no-python, so its headers don't pull Python.h and
  # rust-usd doesn't need a CPython at link time. Without this var
  # rust-usd would default to the macOS framework path and try (and
  # fail) to link against a Python.framework that isn't here.
  USD_LINK_PYTHON: none

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1) — required for arm64 artifact
    timeout-minutes: 120
    steps:
      - name: Checkout forge-paint
        uses: actions/checkout@v4

      # build_usd.py is a Python script. We don't need Python at link
      # time (USD itself is built --no-python), only as a build driver.
      - name: Setup Python (build_usd.py driver)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (stable, aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Cache is split into restore + save so the USD install is
      # persisted as soon as the build finishes, regardless of whether
      # later steps fail. The unified actions/cache@v4 step only saves
      # on full-job success, which would mean a failure in the cargo
      # build or staging step throws away the 30-min OpenUSD compile.
      - name: Restore OpenUSD install
        id: cache-usd
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.USD_INSTALL_DIR }}
          # Bump the trailing -vN any time the build flags below change.
          key: openusd-${{ env.USD_VERSION }}-macos-arm64-no-python-no-imaging-v1

      - name: Checkout OpenUSD source
        if: steps.cache-usd.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: ${{ env.USD_VERSION }}
          path: openusd-src

      - name: Build OpenUSD
        if: steps.cache-usd.outputs.cache-hit != 'true'
        # build_usd.py vendors boost + tbb itself. With --no-imaging /
        # --no-python / --no-usdview we skip Hydra, the Python bindings,
        # and the Qt-based viewer — none of which forge-paint links.
        # rust-usd only needs the core libs (usd, usdGeom, usdShade,
        # sdf, ar, pcp, plug, kind, vt, gf, tf, work, trace, js, arch,
        # ts), all of which live under pxr/usd/.
        run: |
          python openusd-src/build_scripts/build_usd.py \
            --no-python --no-imaging --no-tests \
            --no-examples --no-tutorials --no-docs --no-usdview \
            "$USD_INSTALL_DIR"

      - name: Save OpenUSD install
        if: steps.cache-usd.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.USD_INSTALL_DIR }}
          key: openusd-${{ env.USD_VERSION }}-macos-arm64-no-python-no-imaging-v1

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build forge-paint (release)
        # macOS clang takes -std=c++17 directly (which is what rust-usd's
        # build.rs already passes), so no CXXFLAGS hack is needed here —
        # the same trick we have to play on Windows is unnecessary on
        # macOS where rust-usd was actually verified.
        run: cargo build --release --target aarch64-apple-darwin

      - name: Re-rpath the binary for the bundle layout
        # rust-usd's build.rs bakes -Wl,-rpath,$USD_INSTALL_DIR/lib into
        # forge-paint at link time. That path doesn't exist on the
        # tester's machine, so the loader can't find libusd_*.dylib at
        # startup. Adding @executable_path/usd/lib as an additional
        # rpath teaches the loader to look at the bundled install
        # adjacent to the EXE first. The build-time rpath stays around
        # but is harmless when it doesn't resolve. USD's own dylibs
        # already use @loader_path internally, so they find each other
        # transitively once forge-paint hands them off.
        run: |
          install_name_tool -add_rpath @executable_path/usd/lib \
            target/aarch64-apple-darwin/release/forge-paint

      - name: Stage macOS zip
        run: |
          set -euo pipefail
          stage="$GITHUB_WORKSPACE/dist/forge-paint-macos-arm64"
          mkdir -p "$stage"

          cp target/aarch64-apple-darwin/release/forge-paint "$stage/"

          # Bundle the entire USD install as a sibling `usd/` directory.
          # USD's plugin discovery walks `lib/usd/` and `plugin/usd/`
          # for plugInfo.json files; without them the file-format
          # readers (usda, usdc, usdz) never register and Stage::open
          # returns null on every file. The plugInfo.json files use
          # LibraryPath references relative to themselves, so the tree
          # has to be copied wholesale to keep them resolvable.
          # forge-paint's main() detects this layout at startup and
          # sets PXR_PLUGINPATH_NAME itself.
          cp -R "$USD_INSTALL_DIR" "$stage/usd"

          # Strip non-runtime artifacts to keep the zip lean.
          # build_usd.py emits dSYM bundles for the dylibs (debug
          # info), CMake exports, headers, and bin/ tools we don't
          # invoke at runtime.
          rm -rf "$stage/usd/include" "$stage/usd/share" "$stage/usd/python" || true
          find "$stage/usd" -name '*.dSYM' -exec rm -rf {} + || true
          find "$stage/usd" -name '*.cmake' -delete || true
          find "$stage/usd" -type d -name cmake -exec rm -rf {} + || true
          # bin/ on macOS holds the USD CLI tools (usdcat, usdedit,
          # usdresolve, ...) — strip them. Keep `lib/` intact.
          rm -rf "$stage/usd/bin" || true

          usd_size=$(du -sm "$stage/usd" | cut -f1)
          echo "Bundled usd/ size: ${usd_size} MB"

          # Bundled brushes, stencils, env maps. The asset browser
          # starts empty without these.
          cp -R assets "$stage/"
          if [ -d test_assets ]; then
            cp -R test_assets "$stage/"
          fi

          cat > "$stage/README.txt" <<'EOF'
          forge-paint macOS arm64 (Apple Silicon) test build.

          Run forge-paint directly from this directory. It self-locates
          the bundled `usd/` directory next to itself and configures
          USD's plugin discovery, so no wrapper script is needed.

          On first launch macOS Gatekeeper will refuse the binary
          because it isn't notarized. Right-click forge-paint, choose
          Open, and confirm the dialog — Gatekeeper remembers the
          decision after that. Or strip the quarantine attribute from
          the terminal:

            xattr -dr com.apple.quarantine forge-paint usd/

          Opening files: drag-and-drop a .usda/.usdc/.usdz onto the
          window, or use File > Open. forge:// URIs only resolve when
          launched through anvil; standalone runs are filesystem-only.
          EOF

          cd "$GITHUB_WORKSPACE/dist"
          zip -r forge-paint-macos-arm64.zip forge-paint-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-paint-macos-arm64
          path: dist/forge-paint-macos-arm64.zip
          retention-days: 30

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/forge-paint-macos-arm64.zip

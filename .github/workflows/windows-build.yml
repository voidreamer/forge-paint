name: windows-build

# Hand-off build for sharing forge-paint with Windows testers. Triggered
# manually from the Actions tab, or automatically when a `v*` tag is
# pushed (which also attaches the resulting zip to the GitHub Release).
#
# First run is slow (~30-60 min) because OpenUSD has to compile from
# source. Subsequent runs reuse the cached USD install and finish in
# under 10 min — bump the cache key suffix below to invalidate.
on:
  workflow_dispatch:
    inputs:
      include_hdnsi:
        description: 'Build and package the optional hdNSI delegate. 3Delight is used at build time only; users install the runtime separately.'
        type: boolean
        default: true
  push:
    tags: ['v*']

env:
  # rust-usd / hydra-rs are verified against upstream OpenUSD 25.05.
  # Bump together if the bindings upgrade, otherwise the ABI may not match.
  USD_VERSION: v25.05
  # build_usd.py installs into this prefix; rust-usd's build.rs reads it.
  USD_INSTALL_DIR: ${{ github.workspace }}\usd-install
  USD_LIB_PREFIX: usd_
  # USD is built --no-python, so its headers don't pull Python.h and
  # rust-usd doesn't need a CPython at link time. Without this var
  # rust-usd would default to the macOS framework path and fail.
  USD_LINK_PYTHON: none

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout forge-paint
        uses: actions/checkout@v4

      - name: Use published USD bindings
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          $toml = [regex]::Replace(
            $toml,
            '(?ms)\r?\n# Local-dev source overrides.*?\[patch\.crates-io\].*\z',
            "`n"
          )
          Set-Content Cargo.toml $toml -NoNewline

      # build_usd.py is a Python script. We don't need Python at link
      # time (USD itself is built --no-python), only as a build driver.
      - name: Setup Python (build_usd.py driver)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      # Cache is split into restore + save (instead of one actions/cache
       # step) so the USD install is persisted as soon as the build
       # finishes, regardless of whether later steps fail. The unified
       # action only saves on full-job success, which means a failure
       # in the cargo build or the staging step would silently throw
       # away the 30-min OpenUSD compile.
      - name: Restore OpenUSD install
        id: cache-usd
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.USD_INSTALL_DIR }}
          # Bump the trailing -vN any time the build flags below change.
          key: openusd-${{ env.USD_VERSION }}-windows-msvc-no-python-imaging-v1

      - name: Checkout OpenUSD source
        if: steps.cache-usd.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: ${{ env.USD_VERSION }}
          path: openusd-src

      - name: Build OpenUSD
        if: steps.cache-usd.outputs.cache-hit != 'true'
        shell: pwsh
        # build_usd.py vendors boost + tbb itself. Keep imaging enabled:
        # hydra-rs links Hydra / UsdImagingGL and the release bundle must
        # include hdStorm. We still skip Python, tests, examples, docs and
        # usdview to keep the CI runtime and artifact size under control.
        run: |
          python openusd-src/build_scripts/build_usd.py `
            --no-python --no-tests `
            --no-examples --no-tutorials --no-docs --no-usdview `
            "$env:USD_INSTALL_DIR"

      - name: Save OpenUSD install
        if: steps.cache-usd.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.USD_INSTALL_DIR }}
          key: openusd-${{ env.USD_VERSION }}-windows-msvc-no-python-imaging-v1

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build forge-paint (release)
        shell: pwsh
        env:
          # rust-usd's build.rs targets mostly macOS/Linux
          # toolchain conventions, so the cxx bridge needs MSVC-flavored
          # flags fed through CXXFLAGS:
          #
          #  /std:c++17           USD 25.05 requires C++17. rust-usd
          #                        passes -std=c++17 (GCC syntax) which
          #                        cl.exe ignores; MSVC then defaults
          #                        to C++14 and the std::any /
          #                        std::optional / std::nullopt uses in
          #                        pxr/base/tf/diagnosticBase.h,
          #                        pxr/usd/sdf/listOp.h, etc. fail.
          #  /Zc:__cplusplus      MSVC otherwise reports __cplusplus =
          #                        199711L even under /std:c++17,
          #                        defeating USD's feature probes.
          #  /EHsc                Standard C++ exception model — USD
          #                        and TBB throw across the bridge.
          #  /DNOMINMAX           windows.h (pulled in by TBB) #defines
          #                        min and max as macros, which then
          #                        clobber std::numeric_limits<T>::max()
          #                        in pxrTslRobinMap headers ("illegal
          #                        token on right side of ::"). USD's
          #                        own CMake sets this globally; cc-rs
          #                        doesn't inherit it.
          #  /DWIN32_LEAN_AND_MEAN  Trim windows.h to reduce the chance
          #                        of further macro collisions (also
          #                        what USD's CMake does).
          #  /D_USE_MATH_DEFINES  Enable M_PI and friends in <cmath>;
          #                        USD code expects them.
          CXXFLAGS: /std:c++17 /Zc:__cplusplus /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_USE_MATH_DEFINES
        # rust-usd's build.rs also emits `-Wl,-rpath,...` link args
        # that are macOS/Linux syntax. On Windows they reach link.exe,
        # which ignores them with LNK4044 warnings; the binary still
        # links. If a future MSVC tightens that to a hard error, we'll
        # need a [patch.crates-io] override of rust-usd to gate the
        # rpath emission on cfg(unix).
        run: cargo build --release

      - name: Setup MSVC shell for hdNSI
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.include_hdnsi) }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build requested hdNSI delegate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_hdnsi }}
        shell: pwsh
        env:
          DELIGHT_WINDOWS_ARCHIVE_URL: ${{ secrets.DELIGHT_WINDOWS_ARCHIVE_URL }}
          DELIGHT_WINDOWS_ARCHIVE_PATH: ${{ github.workspace }}\.github\3delight-windows.zip
        run: |
          .github\scripts\package-hdnsi-windows.ps1 `
            -UsdInstallDir "$env:USD_INSTALL_DIR" `
            -OutputDir "$env:GITHUB_WORKSPACE\hdnsi-package"

      - name: Build optional hdNSI delegate for release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          DELIGHT_WINDOWS_ARCHIVE_URL: ${{ secrets.DELIGHT_WINDOWS_ARCHIVE_URL }}
          DELIGHT_WINDOWS_ARCHIVE_PATH: ${{ github.workspace }}\.github\3delight-windows.zip
        run: |
          .github\scripts\package-hdnsi-windows.ps1 `
            -UsdInstallDir "$env:USD_INSTALL_DIR" `
            -OutputDir "$env:GITHUB_WORKSPACE\hdnsi-package" `
            -SkipIfMissing

      - name: Stage Windows zip
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\dist\forge-paint-windows"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item target\release\forge-paint.exe $stage

          # Bundle the entire USD install as a sibling `usd/` directory.
          # USD's plugin discovery walks `lib/usd/` and `plugin/usd/`
          # for plugInfo.json files; without them the file-format
          # readers (usda, usdc, usdz) never register and Stage::open
          # returns null on every file. The plugInfo.json files use
          # LibraryPath references relative to themselves, so the tree
          # has to be copied wholesale to keep them resolvable.
          # forge-paint's main() detects this layout at startup and
          # sets PXR_PLUGINPATH_NAME + plugin/runtime PATH entries
          # before USD is used.
          Copy-Item -Recurse "$env:USD_INSTALL_DIR" "$stage\usd"

          # Strip non-runtime artifacts. build_usd.py builds
          # RelWithDebInfo by default and produces a .pdb next to every
          # .dll — those alone account for several hundred MB.
          # bin/*.exe are the USD CLI tools (usdcat, usdedit,
          # usdresolve, ...) we never invoke. cmake/, share/, *.cmake
          # are dev-time exports. Headers and import .libs are
          # link-time only.
          $stripDirs = @('include', 'share', 'python')
          foreach ($d in $stripDirs) {
            Remove-Item -Recurse -Force "$stage\usd\$d" -ErrorAction SilentlyContinue
          }
          foreach ($pat in '*.pdb','*.lib','*.cmake') {
            Get-ChildItem -Path "$stage\usd" -Recurse -Filter $pat -ErrorAction SilentlyContinue `
              | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Path "$stage\usd" -Recurse -Directory -ErrorAction SilentlyContinue `
            | Where-Object { $_.Name -eq 'cmake' } `
            | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path "$stage\usd\bin") {
            Get-ChildItem -Path "$stage\usd\bin" -Filter *.exe -ErrorAction SilentlyContinue `
              | Remove-Item -Force -ErrorAction SilentlyContinue
          }

          # Second EXE copy inside usd\lib. The bundle-root EXE only
          # bootstraps: at startup it computes the bundle environment
          # and relaunches THIS copy with that environment in place.
          # Running the app from usd\lib means the import table and
          # USD's plug registry resolve the SAME usd_*.dll files —
          # launching from the bundle root instead double-loads
          # OpenUSD (imports bind to the root-level DLL copies, plug
          # later LoadLibrary()s the usd\lib set) and deadlocks inside
          # Hgi::CreatePlatformDefaultHgi on the first Hydra render.
          # It also guarantees PXR_PLUGINPATH_NAME exists before
          # usd_plug.dll's init constructor captures it, which no
          # in-process set_var after process start can do.
          Copy-Item target\release\forge-paint.exe "$stage\usd\lib\forge-paint.exe"

          # Windows resolves DLLs imported by forge-paint.exe before
          # main() runs, so the app's self-locating PATH setup is too
          # late for direct EXE launches. Keep the USD runtime DLLs
          # beside the EXE as well as inside usd/ so double-clicking
          # forge-paint.exe works without a preconfigured shell.
          $directLaunchDllDirs = @("$stage\usd\bin", "$stage\usd\lib") |
            Where-Object { Test-Path $_ }
          foreach ($dllDir in $directLaunchDllDirs) {
            Get-ChildItem -Path $dllDir -Filter *.dll -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $stage -Force
          }
          $usdShadeDll = Get-ChildItem -Path $stage -Filter usd_usdShade.dll -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $usdShadeDll) {
            throw "Windows package is missing root-level usd_usdShade.dll; direct EXE launch would fail before main()."
          }

          Copy-Item .github\scripts\forge-paint-windows.bat "$stage\forge-paint.bat"

          # Report final bundle size so future runs can sanity-check
          # whether new bloat has crept in.
          $usdSize = (Get-ChildItem -Path "$stage\usd" -Recurse -File `
            | Measure-Object -Property Length -Sum).Sum
          "Bundled usd/ size: {0:N0} MB" -f ($usdSize / 1MB) | Write-Host

          # Bundled brushes, stencils, env maps. The asset browser
          # starts empty without these.
          Copy-Item -Recurse assets $stage
          if (Test-Path tools) {
            Copy-Item -Recurse tools $stage
          }
          if (Test-Path test_assets) {
            Copy-Item -Recurse test_assets $stage
          }
          if (Test-Path docs\release.md) {
            Copy-Item docs\release.md "$stage\RELEASE.md"
          }
          if (Test-Path hdnsi-package) {
            # Require the INSTALLED plugin layout, exactly what the
            # plugInfo.json relative paths assume:
            #   hdNSI\hdNSI.dll
            #   hdNSI\resources\plugInfo.json
            # A v0.0.11-era artifact staged the raw CMake build tree
            # here instead; USD then registered the delegate from the
            # stray top-level plugInfo.json but resolved LibraryPath to
            # a nonexistent plugins\usd\hdNSI.dll, and 3Delight could
            # never load ("The specified module could not be found").
            foreach ($required in @("hdnsi-package\hdNSI\hdNSI.dll",
                                    "hdnsi-package\hdNSI\resources\plugInfo.json")) {
              if (-not (Test-Path $required)) {
                throw "hdnsi-package is not an installed hdNSI layout: missing $required"
              }
            }
            New-Item -ItemType Directory -Path "$stage\plugins\usd" -Force | Out-Null
            Copy-Item -Recurse hdnsi-package\* "$stage\plugins\usd"
          }

          @'
          forge-paint Windows test build.

          Run forge-paint.exe directly. The zip keeps the USD DLLs
          that Windows needs beside the EXE, and the app self-locates
          the bundled `usd/` directory at startup for USD plug-ins.

          A forge-paint.bat launcher is also included. Use it when you
          want an explicit shell setup for USD and 3Delight before the
          EXE starts, or when debugging custom installed runtimes.

          If the app fails to start with "VCRUNTIME140.dll" or
          "MSVCP140.dll" missing, install the Microsoft Visual C++
          Redistributable from
          https://aka.ms/vs/17/release/vc_redist.x64.exe.

          Opening files: drag-and-drop a .usd/.usda/.usdc/.usdz or .obj
          onto the window, or use File > Open. OBJ files
          are converted to a .usda file before loading. forge:// URIs
          only resolve when launched through anvil; standalone runs are
          filesystem-only.

          Hydra/Storm is bundled through OpenUSD and shows up in the
          renderer picker by default. The first time a Hydra delegate
          is selected for a stage, forge-paint runs a short
          out-of-process startup check; if your machine cannot bring
          up an OpenGL context (remote desktop, missing driver), the
          viewport shows what failed instead of freezing. Set
          FORGE_PAINT_ENABLE_STORM=0 to hide Storm explicitly.

          The root forge-paint.exe is a thin bootstrap: it relaunches
          the copy at usd\lib\forge-paint.exe with the bundle
          environment set up, so the USD runtime loads exactly once.
          Launch either one; task manager showing two forge-paint
          processes is expected.

          3Delight: install 3Delight on this machine, then restart
          forge-paint. If this zip contains plugins\usd\hdNSI, the app
          self-locates that delegate plus common 3Delight runtime
          folders at startup. It also checks DELIGHT,
          FORGE_PAINT_3DELIGHT_DIR, and common Program Files installs.
          Without an hdNSI plugInfo compatible with the bundled USD,
          the delegate picker will show Storm only.
          '@ | Out-File "$stage\README.txt" -Encoding utf8

          Compress-Archive -Path "$stage\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\dist\forge-paint-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-paint-windows
          path: dist\forge-paint-windows.zip
          retention-days: 30

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\forge-paint-windows.zip
